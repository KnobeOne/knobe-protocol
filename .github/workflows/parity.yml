# Runs the cross-language parity selftest (knobe-core.js vs lens.py over every
# vector and example) and the MCP server smoke test on every push to main and
# on every pull request. The parity check is the repository's conformance
# gate: if the two verifiers disagree on any file, the build fails.
name: parity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    name: Verifier parity (knobe-core.js vs lens.py)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Cross-language parity selftest
        run: node knobe-core.selftest.mjs

  copies:
    # The site and the MCP package serve copies of files whose source lives
    # at the repository root. A fix that reaches only one copy ships a stale
    # file, so every copy must stay byte-identical to its source.
    name: Copies match their source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare every copy with its source
        run: |
          status=0
          same() {
            if ! cmp -s "$1" "$2"; then
              echo "::error file=$2::$2 differs from its source $1"
              status=1
            fi
          }
          same knobe-core.js mcp/knobe-core.js
          same knobe-core.js site/knobe-core.js
          same lens.py site/lens.py
          same ERRATA.md site/ERRATA.md
          # site/test-vectors mirrors test-vectors, plus its own index page.
          if ! diff -r --exclude=index.html test-vectors site/test-vectors; then
            echo "::error file=site/test-vectors::site/test-vectors differs from test-vectors"
            status=1
          fi
          # Sealed examples the site also serves.
          for f in site/*.knobe.md; do
            src="examples/$(basename "$f")"
            if [ -f "$src" ]; then same "$src" "$f"; fi
          done
          exit $status

  mcp-smoke:
    name: MCP server smoke test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: mcp
      - name: Client/server round-trip over in-memory transport
        run: npm test
        working-directory: mcp
